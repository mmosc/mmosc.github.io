<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Timeline mock (fake data) — tasks/plan.md Task 1.1</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 2rem 1rem 6rem;
        background: #fafafa;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p.note {
        color: #666;
        font-size: 0.9rem;
        margin: 0 0 1.5rem;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: flex-start;
        margin-bottom: 2rem;
        padding: 1rem;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
      }
      .controls fieldset {
        border: none;
        padding: 0;
        margin: 0;
      }
      .controls legend {
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 0.4rem;
        padding: 0;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.85rem;
        margin-right: 0.75rem;
      }
      .range-inputs {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
      }

      .timeline-wrapper {
        position: relative;
        max-width: 900px;
        margin: 0 auto;
      }
      .timeline-container {
        position: relative;
      }
      .timeline-track {
        position: absolute;
        left: 50%;
        top: 0;
        width: 14px;
        transform: translateX(-50%);
        border-radius: 7px;
        overflow: hidden;
      }
      .track-segment {
        position: absolute;
        left: 0;
        width: 100%;
      }
      .leader-lines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .leader-lines line {
        stroke: #999;
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
      }

      .card {
        position: absolute;
        width: 320px;
        box-sizing: border-box;
        background: #fff;
        border: 1px solid #ddd;
        border-left: 6px solid var(--card-color, #888);
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        transition:
          opacity 0.15s ease,
          top 0.15s ease;
      }
      .card.left {
        right: calc(50% + 30px);
        text-align: right;
      }
      .card.right {
        left: calc(50% + 30px);
        text-align: left;
      }
      .card.hidden {
        display: none;
      }
      .card .card-date {
        font-size: 0.7rem;
        color: #777;
        margin-bottom: 0.15rem;
      }
      .card .card-title {
        font-weight: 600;
        line-height: 1.3;
        margin-bottom: 0.3rem;
      }
      .card .card-venue {
        font-style: italic;
        font-size: 0.7rem;
        color: #555;
        line-height: 1.3;
        margin-bottom: 0.3rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .card-topics {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .card.left .card-topics {
        justify-content: flex-end;
      }
      .topic-pill {
        display: inline-block;
        font-size: 0.65rem;
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        color: #fff;
        white-space: nowrap;
      }

      .legend-swatch {
        display: inline-block;
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 3px;
        flex: none;
      }
      #job-legend label {
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Career timeline — mock (fake data)</h1>
    <p class="note">
      Scratch prototype for <code>tasks/plan.md</code> Task 1.1. Not shipped, not built by Jekyll — open directly in
      a browser. All jobs/papers below are fictional.
    </p>

    <div class="controls">
      <fieldset>
        <legend>Time range (month granularity)</legend>
        <div class="range-inputs">
          <input type="month" id="range-start" />
          <span>to</span>
          <input type="month" id="range-end" />
          <button type="button" id="range-reset">Reset</button>
        </div>
      </fieldset>
      <fieldset id="topic-filters">
        <legend>Topics</legend>
      </fieldset>
      <fieldset id="job-legend">
        <legend>Jobs</legend>
      </fieldset>
    </div>

    <div class="timeline-wrapper">
      <div class="timeline-container" id="timeline-container">
        <div class="timeline-track" id="timeline-track"></div>
        <svg class="leader-lines" id="leader-lines"></svg>
        <!-- cards injected here by script -->
      </div>
    </div>

    <script src="timeline_mock_logic.js"></script>
    <script>
      (function () {
        const BASELINE_TRACK_HEIGHT = 2400; // floor height; grows if packed cards need more room (see render())
        const CARD_HEIGHT = 112; // bumped from 92 to account for the added single-line venue text
        const CARD_MIN_GAP = 14;
        const TOP_PADDING = 20;

        const now = Date.now();
        const t = (isoDate) => new Date(isoDate).getTime();

        // --- Fake data -----------------------------------------------------
        // Jobs are back-to-back with no gaps (matching the real cv.yml data
        // shape — Marta's actual career has no unemployment gaps, only
        // overlaps), so the bar renders continuously end to end.
        const jobs = [
          { id: "physics-institute", label: "Physics Institute — Postdoc", color: "#9C36B5", start: t("2017-01-01"), end: t("2019-01-01") },
          { id: "univ-nowhere", label: "University of Nowhere — PhD Researcher", color: "#4C6EF5", start: t("2019-01-01"), end: t("2022-01-01") },
          { id: "acme-labs", label: "Acme Research Labs — Research Intern", color: "#F76707", start: t("2021-06-01"), end: t("2021-12-01") },
          { id: "fictional-ai", label: "Fictional AI Corp — Applied Scientist", color: "#2F9E44", start: t("2022-01-01"), end: now },
        ];

        // Real topic names and colors (tasks/plan.md Task 2.2/2.3), so this
        // mock previews the actual legend rather than a placeholder one.
        // Colors are the dataviz-skill categorical palette, light-mode
        // values (this mock has no dark-mode CSS support), order-validated
        // via scripts/validate_palette.js — see _data/timeline_colors.yml
        // for the full light/dark mapping and the reasoning.
        const TOPIC_COLORS = {
          "particle-physics": "#2a78d6",
          "multimodal-learning": "#1baf7a",
          "recommender-systems": "#eb6834",
          "music-information-retrieval": "#4a3aa7",
        };

        const papers = [
          { id: "p1", title: "A Fictional Approach to Lepton Universality", venue: "Proc. of Fictional Physics Conference", date: t("2017-06-01"), topics: ["particle-physics"] },
          { id: "p2", title: "Notes on Simulated Flavor Anomalies", venue: "Fictional Journal of Physics", date: t("2018-03-01"), topics: ["particle-physics"] },
          { id: "p3", title: "Cross-Modal Embeddings for Toy Data", venue: "Proc. of Toy Multimodal Workshop", date: t("2019-09-01"), topics: ["multimodal-learning"] },
          { id: "p4", title: "Session-Based Recommendations, Revisited", venue: "Proc. of Fictional RecSys Conference", date: t("2020-05-01"), topics: ["recommender-systems"] },
          { id: "p5", title: "A Mock Dataset for Music Discovery", venue: "Proc. of Fictional Music Retrieval Conference", date: t("2021-02-01"), topics: ["music-information-retrieval"] },
          { id: "p6", title: "Multimodal Cold-Start: A Small Study", venue: "Proc. of Fictional RecSys Conference", date: t("2021-07-01"), topics: ["multimodal-learning", "recommender-systems"] },
          { id: "p7", title: "Emotion Tags Reconsidered", venue: "Transactions of Fictional Music Retrieval", date: t("2021-10-01"), topics: ["music-information-retrieval"] },
          { id: "p8", title: "Fair Diffusion for Fictional Catalogs", venue: "Proc. of Fictional RecSys Conference", date: t("2022-04-01"), topics: ["recommender-systems"] },
          { id: "p9", title: "Voice-Face Association, A Toy Benchmark", venue: "Proc. of Toy Multimodal Workshop", date: t("2023-11-01"), topics: ["multimodal-learning"] },
          { id: "p10", title: "Networked Tastes: A Simulation", venue: "Workshops of Fictional RecSys Conference", date: t("2025-03-01"), topics: ["recommender-systems", "music-information-retrieval"] },
        ];

        const minTime = Math.min(...jobs.map((j) => j.start));
        const maxTime = Math.max(...jobs.map((j) => j.end), ...papers.map((p) => p.date));

        // Time-to-pixel mapping always uses this fixed scale, so the bar stays
        // strictly linear/proportional to elapsed time. Cards that collide when
        // packed may need extra *visual* room below that point; effectiveTrackHeight
        // (computed once per render in render()) reserves that space without
        // touching the time scale itself — see timeline_real_preview.html for
        // the fuller rationale (same fix, same reasoning, real data there
        // exposed the bug first).
        let effectiveTrackHeight = BASELINE_TRACK_HEIGHT;
        const pos = (time) => TOP_PADDING + TimelineMockLogic.dateToPosition(time, minTime, maxTime, BASELINE_TRACK_HEIGHT);

        // --- DOM refs --------------------------------------------------------
        const container = document.getElementById("timeline-container");
        const track = document.getElementById("timeline-track");
        const svg = document.getElementById("leader-lines");
        const topicFieldset = document.getElementById("topic-filters");
        const rangeStart = document.getElementById("range-start");
        const rangeEnd = document.getElementById("range-end");
        const rangeReset = document.getElementById("range-reset");

        const monthInput = (time) => new Date(time).toISOString().slice(0, 7);
        rangeStart.value = monthInput(minTime);
        rangeEnd.value = monthInput(maxTime);

        const topicLabel = (topicId) => topicId.split("-").map((word) => word[0].toUpperCase() + word.slice(1)).join(" ");

        Object.entries(TOPIC_COLORS).forEach(([topicId, color]) => {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = true;
          input.dataset.topic = topicId;
          const swatch = document.createElement("span");
          swatch.className = "legend-swatch";
          swatch.style.background = color;
          label.appendChild(input);
          label.appendChild(swatch);
          label.appendChild(document.createTextNode(topicLabel(topicId)));
          topicFieldset.appendChild(label);
        });

        const jobLegend = document.getElementById("job-legend");
        jobs.forEach((job) => {
          const label = document.createElement("label");
          const swatch = document.createElement("span");
          swatch.className = "legend-swatch";
          swatch.style.background = job.color;
          label.appendChild(swatch);
          label.appendChild(document.createTextNode(job.label));
          jobLegend.appendChild(label);
        });

        track.style.top = TOP_PADDING + "px";

        function renderTrack() {
          track.innerHTML = "";
          const segments = TimelineMockLogic.computeJobSegments(
            jobs.map((j) => ({ id: j.id, color: j.color, startTime: j.start, endTime: j.end })),
          );
          segments.forEach((seg) => {
            const el = document.createElement("div");
            el.className = "track-segment";
            const top = pos(seg.start);
            const height = Math.max(pos(seg.end) - top, 1);
            el.style.top = top + "px";
            el.style.height = height + "px";
            if (seg.colors.length === 1) {
              el.style.background = seg.colors[0];
            } else {
              // 45-degree intertwined stripes for overlapping jobs
              const stripeSize = 14;
              el.style.background = `repeating-linear-gradient(45deg, ${seg.colors[0]} 0 ${stripeSize}px, ${seg.colors[1]} ${stripeSize}px ${stripeSize * 2}px)`;
            }
            track.appendChild(el);
          });
        }

        function activeFilters() {
          const startMs = rangeStart.value ? new Date(rangeStart.value + "-01").getTime() : minTime;
          const endMs = rangeEnd.value ? new Date(rangeEnd.value + "-01").getTime() : maxTime;
          const activeTopics = new Set(
            Array.from(topicFieldset.querySelectorAll("input[type=checkbox]:checked")).map((i) => i.dataset.topic),
          );
          return { startMs, endMs, activeTopics };
        }

        function renderCards(visible) {
          container.querySelectorAll(".card").forEach((n) => n.remove());
          svg.innerHTML = "";
          svg.setAttribute("width", "100%");
          svg.setAttribute("height", container.style.height);

          const packed = TimelineMockLogic.packCards(
            visible.map((p) => ({ id: p.id, idealPosition: pos(p.date) })),
            CARD_HEIGHT,
            CARD_MIN_GAP,
          );
          const packedById = Object.fromEntries(packed.map((p) => [p.id, p]));

          visible.forEach((paper) => {
            const placement = packedById[paper.id];
            const card = document.createElement("div");
            card.className = "card " + placement.side;
            card.style.top = placement.top + "px";
            card.style.setProperty("--card-color", TOPIC_COLORS[paper.topics[0]]);

            const dateEl = document.createElement("div");
            dateEl.className = "card-date";
            dateEl.textContent = new Date(paper.date).toLocaleDateString(undefined, { year: "numeric", month: "short" });
            card.appendChild(dateEl);

            const titleEl = document.createElement("div");
            titleEl.className = "card-title";
            titleEl.textContent = paper.title;
            card.appendChild(titleEl);

            const venueEl = document.createElement("div");
            venueEl.className = "card-venue";
            venueEl.textContent = paper.venue;
            venueEl.title = paper.venue;
            card.appendChild(venueEl);

            const topicsEl = document.createElement("div");
            topicsEl.className = "card-topics";
            paper.topics.forEach((tp) => {
              const pill = document.createElement("span");
              pill.className = "topic-pill";
              pill.style.background = TOPIC_COLORS[tp];
              pill.textContent = topicLabel(tp);
              topicsEl.appendChild(pill);
            });
            card.appendChild(topicsEl);

            container.appendChild(card);

            // dashed leader line from the card's inner edge to its date on the bar
            const cardRect = card.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const cardMidY = placement.top + CARD_HEIGHT / 2;
            const barY = pos(paper.date);
            const barX = containerRect.width / 2;
            const cardEdgeX = placement.side === "left" ? cardRect.right - containerRect.left : cardRect.left - containerRect.left;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", cardEdgeX);
            line.setAttribute("y1", cardMidY);
            line.setAttribute("x2", barX + (placement.side === "left" ? -7 : 7));
            line.setAttribute("y2", barY);
            svg.appendChild(line);
          });
        }

        function render() {
          const visible = TimelineMockLogic.filterPapers(papers, activeFilters());

          // Ask (once, at the fixed time scale above) how much room the packed
          // cards actually need; grow the bar/container to match so there's
          // never a dead zone below the last card, without ever touching pos()'s
          // time-proportional mapping.
          const idealPositions = visible.map((p) => ({ id: p.id, idealPosition: pos(p.date) }));
          const requiredContentBottom = TimelineMockLogic.computeRequiredTrackHeight(
            idealPositions,
            CARD_HEIGHT,
            CARD_MIN_GAP,
            TOP_PADDING + BASELINE_TRACK_HEIGHT,
          );
          effectiveTrackHeight = requiredContentBottom - TOP_PADDING;
          track.style.height = effectiveTrackHeight + "px";
          container.style.height = TOP_PADDING * 2 + effectiveTrackHeight + "px";

          renderTrack();
          renderCards(visible);
        }

        [rangeStart, rangeEnd].forEach((el) => el.addEventListener("change", render));
        topicFieldset.addEventListener("change", render);
        rangeReset.addEventListener("click", () => {
          rangeStart.value = monthInput(minTime);
          rangeEnd.value = monthInput(maxTime);
          topicFieldset.querySelectorAll("input[type=checkbox]").forEach((i) => (i.checked = true));
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
